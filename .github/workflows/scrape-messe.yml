name: Scrape Messe

on:
  schedule:
    # 03:30 UTC = 05:30 Uhr deutscher Sommerzeit (CEST).
    # Nach der Zeitumstellung im Winter (CET) ggf. auf "30 4 * * *" anpassen.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape_messe.py

      - name: Commit result
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatisches Update: messe.json"
          file_pattern: messe.json

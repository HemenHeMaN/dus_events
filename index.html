<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Düsseldorf Event Dashboard</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #e30613; /* D.LIVE / Düsseldorf Red */
      --primary-hover: #b8040f;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 25px;
    }

    /* --- FILTER BUTTONS LAYOUT (1 - 3 - 3) --- */
    .filter-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 35px;
    }

    .filter-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .filter-btn {
      background-color: #ffffff;
      color: var(--text-main);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      text-align: center;
    }

    /* Row 1: Single Top Button */
    .filter-row.row-1 .filter-btn {
      width: 100%;
      max-width: 320px;
      font-size: 1.25rem;
      padding: 16px 24px;
    }

    /* Rows 2 & 3: 3 Grid Columns */
    .filter-row.grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      max-width: 700px;
      margin: 0 auto;
    }

    .filter-row.grid-3 .filter-btn {
      width: 100%;
    }

    /* Active & Hover States */
    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .filter-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(227, 6, 19, 0.3);
    }

    /* Event Cards */
    .event-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border-left: 5px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-info h3 {
      margin: 0 0 6px 0;
      font-size: 1.2rem;
    }

    .event-meta {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background-color: #f3f4f6;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      .filter-btn {
        font-size: 1rem;
        padding: 12px 8px;
      }
      .filter-row.row-1 .filter-btn {
        font-size: 1.1rem;
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Düsseldorf Events</h1>

    <!-- Filter Buttons (1 - 3 - 3 Layout) -->
    <div class="filter-container">
      
      <!-- Reihe 1: Alle -->
      <div class="filter-row row-1">
        <button class="filter-btn active" onclick="filterEvents('all', this)">Alle</button>
      </div>

      <!-- Reihe 2: Arena, Dome, MEH -->
      <div class="filter-row grid-3">
        <button class="filter-btn" onclick="filterEvents('arena', this)">Arena</button>
        <button class="filter-btn" onclick="filterEvents('dome', this)">Dome</button>
        <button class="filter-btn" onclick="filterEvents('meh', this)">MEH</button>
      </div>

      <!-- Reihe 3: Messe, DEG, Fortuna -->
      <div class="filter-row grid-3">
        <button class="filter-btn" onclick="filterEvents('messe', this)">Messe</button>
        <button class="filter-btn" onclick="filterEvents('deg', this)">DEG</button>
        <button class="filter-btn" onclick="filterEvents('fortuna', this)">Fortuna</button>
      </div>

    </div>

    <!-- Event Liste -->
    <div id="events-list">
      <!-- Beispiel-Events -->
      <div class="event-card" data-venue="arena">
        <div class="event-info">
          <h3>Konzert / Mega-Event</h3>
          <div class="event-meta">Datum: Sa, 10. Okt 2026 | Uhrzeit: 20:00 Uhr</div>
          <span class="badge">MERKUR SPIEL-ARENA</span>
        </div>
      </div>

      <div class="event-card" data-venue="deg">
        <div class="event-info">
          <h3>DEG vs. Kölner Haie</h3>
          <div class="event-meta">Datum: So, 11. Okt 2026 | Uhrzeit: 16:30 Uhr</div>
          <span class="badge">PSD BANK DOME (DEG)</span>
        </div>
      </div>

      <div class="event-card" data-venue="meh">
        <div class="event-info">
          <h3>Live Comedy Show</h3>
          <div class="event-meta">Datum: Fr, 16. Okt 2026 | Uhrzeit: 19:30 Uhr</div>
          <span class="badge">Mitsubishi Electric HALLE</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function filterEvents(venue, btnElement) {
      // Button Active-State umschalten
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      btnElement.classList.add('active');

      // Cards filtern
      const cards = document.querySelectorAll('.event-card');
      cards.forEach(card => {
        if (venue === 'all' || card.getAttribute('data-venue') === venue) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
